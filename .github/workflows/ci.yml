name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql://lms_app:ci@ci-pooler.invalid/lms
      DATABASE_URL_OWNER: postgresql://lms_owner:ci@ci.invalid/lms
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python manage.py check
      - name: Production settings refuse unsafe config
        run: |
          if DJANGO_SETTINGS_MODULE=config.settings.prod python manage.py check 2>/dev/null; then
            echo "prod settings started without secrets" && exit 1
          fi
      - run: python manage.py makemigrations --check --dry-run
      # Database tests (incl. core/tests/test_rls.py) run against a Neon preview branch:
      # add NEON_API_KEY as a secret and the neondatabase/create-branch-action step here.

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm install   # switch to `npm ci` once package-lock.json is committed
      - run: npx --yes oxlint
      - run: npm run build

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
