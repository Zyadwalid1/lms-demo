[project]
name = "lms-backend"
version = "0.1.0"
requires-python = ">=3.12"

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["**/migrations/*"]

[tool.ruff.lint]
# E/F errors, I imports, B bugbear, UP pyupgrade, DJ django, S security (bandit), BLE blind except
select = ["E", "F", "I", "B", "UP", "DJ", "S", "BLE"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106"]
"config/settings/*" = ["F405"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "core", "config"]
